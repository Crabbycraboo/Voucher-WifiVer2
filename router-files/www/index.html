<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WiFi Access</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #1A1208;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: 'Courier New', Courier, monospace;
  }

  .card {
    background: #F5F0E8;
    border-radius: 16px;
    padding: 40px 32px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .icon {
    font-size: 36px;
    margin-bottom: 10px;
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    color: #1A1208;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7A6A5A;
    margin-bottom: 28px;
  }

  .divider {
    height: 1px;
    background: #D4C9B8;
    margin-bottom: 28px;
  }

  .prompt {
    font-size: 13px;
    color: #5A4A3A;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 12px;
  }

  #code-input {
    width: 100%;
    padding: 14px 16px;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
    text-transform: uppercase;
    background: #fff;
    border: 2px solid #D4C9B8;
    border-radius: 10px;
    color: #1A1208;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  #code-input:focus { border-color: #C8852A; }
  #code-input.error { border-color: #9B2335; animation: shake 0.3s ease; }
  #code-input.success { border-color: #2D6A4F; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #connect-btn {
    width: 100%;
    padding: 15px;
    background: #1A1208;
    color: #F5F0E8;
    border: none;
    border-radius: 10px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    -webkit-appearance: none;
  }

  #connect-btn:active { transform: scale(0.98); }
  #connect-btn:disabled { background: #A09080; cursor: not-allowed; }
  #connect-btn.loading { background: #3D2B1A; }

  /* Message states */
  .msg {
    margin-top: 14px;
    font-size: 13px;
    min-height: 20px;
    line-height: 1.5;
  }

  .msg.err { color: #9B2335; }
  .msg.ok  { color: #2D6A4F; font-weight: 700; }
  .msg.tip { color: #7A6A5A; }

  /* Success screen */
  #success-screen {
    display: none;
    text-align: center;
  }

  .success-icon {
    font-size: 52px;
    margin-bottom: 12px;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .success-title {
    font-size: 22px;
    font-weight: 700;
    color: #2D6A4F;
    margin-bottom: 8px;
  }

  .success-sub {
    font-size: 13px;
    color: #5A4A3A;
    line-height: 1.6;
  }

  .timer-bar-wrap {
    background: #D4C9B8;
    border-radius: 99px;
    height: 6px;
    margin: 20px 0 8px;
    overflow: hidden;
  }

  .timer-bar {
    height: 100%;
    background: #2D6A4F;
    border-radius: 99px;
    width: 100%;
    transition: width 1s linear;
  }

  .timer-label {
    font-size: 11px;
    color: #7A6A5A;
    letter-spacing: 1px;
  }

  .footer {
    margin-top: 28px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #B0A090;
  }
</style>
</head>
<body>
<div class="card">

  <!-- Entry Screen -->
  <div id="entry-screen">
    <div class="icon">☕</div>
    <div class="title">Cafe WiFi</div>
    <div class="subtitle">Free · Fast · 2 Hours</div>
    <div class="divider"></div>

    <div class="prompt">Enter your voucher code<br>to get online</div>

    <div class="input-wrap">
      <input type="text"
             id="code-input"
             placeholder="CAFE-XXXXXX"
             maxlength="12"
             autocomplete="off"
             autocorrect="off"
             autocapitalize="characters"
             spellcheck="false"
             oninput="onType()"
             onkeydown="if(event.key==='Enter') redeem()">
    </div>

    <button id="connect-btn" onclick="redeem()">Connect</button>
    <div class="msg tip" id="msg">Purchase a voucher at the counter</div>
  </div>

  <!-- Success Screen -->
  <div id="success-screen">
    <div class="success-icon">✓</div>
    <div class="success-title">You're connected!</div>
    <div class="success-sub">Enjoy <strong>2 hours</strong> of free WiFi.<br>Your session started just now.</div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>
    <div class="timer-label" id="timer-label">2:00:00 remaining</div>
  </div>

  <div class="footer">VoucherWave</div>
</div>

<script>
  var SESSION_MS = 2 * 60 * 60 * 1000; // 2 hours
  var startTime = null;
  var timerInterval = null;

  function onType() {
    var inp = document.getElementById('code-input');
    inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    inp.classList.remove('error');
    document.getElementById('msg').textContent = 'Purchase a voucher at the counter';
    document.getElementById('msg').className = 'msg tip';
  }

  function redeem() {
    var inp = document.getElementById('code-input');
    var code = inp.value.trim();
    if (!code) return;

    var btn = document.getElementById('connect-btn');
    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = 'Connecting...';

    fetch('/cgi-bin/redeem?code=' + encodeURIComponent(code))
      .then(function(r) { return r.text(); })
      .then(function(t) {
        var result = t.trim();
        if (result === 'OK') {
          showSuccess();
        } else if (result === 'USED') {
          setError('This voucher has already been used.');
        } else if (result === 'INVALID') {
          setError('Invalid code. Check and try again.');
        } else {
          setError('Something went wrong. Try again.');
        }
      })
      .catch(function() {
        setError('Could not reach router. Try again.');
      })
      .finally(function() {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.textContent = 'Connect';
      });
  }

  function setError(msg) {
    var inp = document.getElementById('code-input');
    inp.classList.add('error');
    var el = document.getElementById('msg');
    el.textContent = msg;
    el.className = 'msg err';
  }

  function showSuccess() {
    document.getElementById('entry-screen').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
    startTime = Date.now();
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  function updateTimer() {
    var elapsed = Date.now() - startTime;
    var remaining = Math.max(0, SESSION_MS - elapsed);
    var pct = (remaining / SESSION_MS) * 100;

    document.getElementById('timer-bar').style.width = pct + '%';

    var h = Math.floor(remaining / 3600000);
    var m = Math.floor((remaining % 3600000) / 60000);
    var s = Math.floor((remaining % 60000) / 1000);
    document.getElementById('timer-label').textContent =
      h + ':' + pad(m) + ':' + pad(s) + ' remaining';

    if (remaining === 0) {
      clearInterval(timerInterval);
      document.getElementById('timer-label').textContent = 'Session ended. Please buy a new voucher.';
    }
  }

  function pad(n) { return n < 10 ? '0' + n : n; }
</script>
</body>
</html>
